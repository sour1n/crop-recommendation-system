<script>
    async function handleFormSubmit(event) {
        event.preventDefault();

        const n = parseFloat(document.getElementById('nitrogen').value);
        const p = parseFloat(document.getElementById('phosphorus').value);
        const k = parseFloat(document.getElementById('potassium').value);
        const temp = parseFloat(document.getElementById('temperature').value);
        const humidity = parseFloat(document.getElementById('humidity').value);
        const ph = parseFloat(document.getElementById('ph').value);
        const rainfall = parseFloat(document.getElementById('rainfall').value);

        const resultBox = document.getElementById('result');
        const resultText = document.getElementById('recommendedCropText');

        resultText.innerText = "Analyzing parameters...";
        resultBox.style.display = "block";

        try {
            // Load ONNX model session
            const session = await ort.InferenceSession.create('./crop_model.onnx');

            // Find the exact input tensor name dynamically
            const inputName = session.inputNames[0];

            // Construct Float32 input tensor
            const inputData = Float32Array.from([n, p, k, temp, humidity, ph, rainfall]);
            const tensor = new ort.Tensor('float32', inputData, [1, 7]);

            // Map inputs
            const feeds = {};
            feeds[inputName] = tensor;

            // Find the predicted label output name (usually session.outputNames[0] or 'label')
            const labelOutputName = session.outputNames[0];

            // Run inference specifying ONLY the label output name to bypass sequence/map outputs
            const results = await session.run(feeds, [labelOutputName]);

            // Extract the predicted crop name
            const predictedCrop = results[labelOutputName].data[0];
            resultText.innerText = predictedCrop;

        } catch (error) {
            console.error("ONNX Inference Error:", error);
            resultText.innerText = "Error evaluating model. Check console details.";
        }
    }
</script>
